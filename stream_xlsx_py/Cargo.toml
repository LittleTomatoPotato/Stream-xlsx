[package]
name = "stream_xlsx_py"
version = "0.3.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
stream_xlsx = { path = "../stream_xlsx" }
anyhow = "1.0.102"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
pyo3-polars = "0.28"
polars = "0.55.2"

[package.metadata.maturin]
module-name = "stream_xlsx_py"

[tool.maturin]
python-source = "python"

# 声明为独立 workspace，避免被上级 workspace 包含，同时不影响 maturin build
[workspace]
